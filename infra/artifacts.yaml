AWSTemplateFormatVersion: '2010-09-09'
Description: InfraLens deployment artifacts; tracked separately from report storage

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  Deployment:
    Type: String
    Default: infralens-dev

Resources:
  ArtifactsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - {Key: Project, Value: infralens}
        - {Key: Environment, Value: !Ref Environment}
        - {Key: ManagedBy, Value: cloudformation}
        - {Key: Deployment, Value: !Ref Deployment}
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  ArtifactsPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: RequireTLS
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt ArtifactsBucket.Arn, !Sub '${ArtifactsBucket.Arn}/*']
            Condition:
              Bool:
                aws:SecureTransport: 'false'

Outputs:
  ArtifactsBucket:
    Value: !Ref ArtifactsBucket
