AWSTemplateFormatVersion: '2010-09-09'
Description: InfraLens static dashboard - private S3 with CloudFront OAC

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  Deployment:
    Type: String
    Default: infralens-dev
    AllowedPattern: '[a-zA-Z][a-zA-Z0-9-]{0,63}'
  ApiOrigin:
    Type: String
    AllowedPattern: 'https://[a-zA-Z0-9.-]+'
  AuthOrigin:
    Type: String
    AllowedPattern: 'https://[a-zA-Z0-9.-]+'
  IssuerOrigin:
    Type: String
    AllowedPattern: 'https://[a-zA-Z0-9.-]+'

Resources:
  FrontendBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      Tags:
        - {Key: Project, Value: infralens}
        - {Key: Environment, Value: !Ref Environment}
        - {Key: ManagedBy, Value: cloudformation}
        - {Key: Deployment, Value: !Ref Deployment}

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudFrontReadOnly
            Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
          - Sid: RequireTLS
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt FrontendBucket.Arn, !Sub '${FrontendBucket.Arn}/*']
            Condition:
              Bool: {aws:SecureTransport: 'false'}

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-s3'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  RouteRewrite:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-routes'
      AutoPublish: true
      FunctionConfig:
        Comment: Rewrite dashboard routes only; preserve missing asset errors
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri === '/' || uri === '/auth/callback' ||
              /^\/projects(?:\/[^/]+)?\/?$/.test(uri) ||
              /^\/runs\/[^/]+(?:\/findings\/[^/]+)?\/?$/.test(uri)) {
            request.uri = '/index.html';
          }
          return request;
        }
      Tags:
        - {Key: Project, Value: infralens}
        - {Key: Environment, Value: !Ref Environment}
        - {Key: ManagedBy, Value: cloudformation}
        - {Key: Deployment, Value: !Ref Deployment}

  HtmlCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub '${AWS::StackName}-html'
        MinTTL: 0
        DefaultTTL: 0
        MaxTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingBrotli: false
          EnableAcceptEncodingGzip: false
          CookiesConfig: {CookieBehavior: none}
          HeadersConfig: {HeaderBehavior: none}
          QueryStringsConfig: {QueryStringBehavior: none}

  AssetCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub '${AWS::StackName}-assets'
        MinTTL: 0
        DefaultTTL: 31536000
        MaxTTL: 31536000
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingBrotli: true
          EnableAcceptEncodingGzip: true
          CookiesConfig: {CookieBehavior: none}
          HeadersConfig: {HeaderBehavior: none}
          QueryStringsConfig: {QueryStringBehavior: none}

  ResponseHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${AWS::StackName}-security'
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            ContentSecurityPolicy: !Sub "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' ${ApiOrigin} ${AuthOrigin} ${IssuerOrigin}; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self' ${AuthOrigin}"
            Override: true
          ContentTypeOptions: {Override: true}
          FrameOptions: {FrameOption: DENY, Override: true}
          ReferrerPolicy: {ReferrerPolicy: no-referrer, Override: true}
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      Tags:
        - {Key: Project, Value: infralens}
        - {Key: Environment, Value: !Ref Environment}
        - {Key: ManagedBy, Value: cloudformation}
        - {Key: Deployment, Value: !Ref Deployment}
      DistributionConfig:
        Comment: !Sub 'InfraLens ${Environment} dashboard'
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_All
        DefaultRootObject: index.html
        ViewerCertificate: {CloudFrontDefaultCertificate: true}
        Origins:
          - Id: frontend
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref OriginAccessControl
            S3OriginConfig: {OriginAccessIdentity: ''}
        DefaultCacheBehavior:
          TargetOriginId: frontend
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: !Ref HtmlCachePolicy
          ResponseHeadersPolicyId: !Ref ResponseHeaders
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt RouteRewrite.FunctionARN
        CacheBehaviors:
          - PathPattern: '/assets/*'
            TargetOriginId: frontend
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: !Ref AssetCachePolicy
            ResponseHeadersPolicyId: !Ref ResponseHeaders
        CustomErrorResponses:
          - {ErrorCode: 403, ErrorCachingMinTTL: 0}
          - {ErrorCode: 404, ErrorCachingMinTTL: 0}

Outputs:
  FrontendBucket:
    Value: !Ref FrontendBucket
  DistributionId:
    Value: !Ref Distribution
  DistributionDomain:
    Value: !GetAtt Distribution.DomainName
  FrontendUrl:
    Value: !Sub 'https://${Distribution.DomainName}'
