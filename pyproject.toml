[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "infralens"
version = "0.1.0"
description = "Terraform security scanning with Trivy and a CLI foundation for drift detection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-hcl2>=8.1.4,<9",
    "pywin32>=310,<400 ; sys_platform == 'win32'",
    "typer>=0.24,<1",
]

[project.scripts]
infralens = "infralens.cli:main"

[project.optional-dependencies]
aws-demo = ["boto3[crt]>=1.40,<2"]
aws-trace = ["boto3[crt]>=1.40,<2"]
backend = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "filelock>=3.16,<4"]

[dependency-groups]
dev = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "filelock>=3.16,<4",
    "httpx>=0.27,<1",
    "boto3[crt]>=1.40,<2",
    "distlib>=0.4,<1",
    "jsonschema>=4,<5",
    "pytest>=8,<10",
    "ruff>=0.14,<1",
]

[tool.hatch.build.hooks.custom]

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/scripts", "/vendor", "/tests", "/hatch_build.py",
    "/pyproject.toml", "/uv.lock", "/README.md", "/CHANGELOG.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a real Trivy 0.76.x binary",
    "network: integration checks that download remote Terraform modules",
    "docker: requires a working Docker daemon and a built InfraLens image",
    "terraform: requires a real Terraform >=1.1,<2 executable",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
